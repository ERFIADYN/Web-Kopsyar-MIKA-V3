<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #f5f7f8;
      --surface: #ffffff;
      --surface-2: #edf6f3;
      --line: #d8e0e5;
      --line-strong: #b9c8d0;
      --text: #1f2933;
      --muted: #657381;
      --brand: #0f766e;
      --brand-dark: #0b5f59;
      --blue: #2563eb;
      --amber: #b45309;
      --red: #b91c1c;
      --green: #15803d;
      --shadow: 0 18px 48px rgba(31, 41, 51, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 18px 14px;
      background: #ffffff;
      border-right: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 8px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid #b7ddd3;
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--brand);
      font-weight: 800;
      overflow: hidden;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .menu {
      display: grid;
      gap: 6px;
    }

    .menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: #344252;
      text-align: left;
    }

    .menu button:hover {
      background: #f0f4f5;
      border-color: var(--line);
    }

    .menu button.active {
      background: var(--surface-2);
      border-color: #a8d4ca;
      color: var(--brand-dark);
      font-weight: 700;
    }

    .menu svg,
    .icon-button svg,
    .btn svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fafbfb;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 78px;
      padding: 16px 26px;
      border-bottom: 1px solid var(--line);
      background: rgba(245, 247, 248, 0.92);
      backdrop-filter: blur(12px);
    }

    .topbar p {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .content {
      width: 100%;
      max-width: 1480px;
      padding: 22px 26px 40px;
    }

    .toolbar,
    .period-bar,
    .table-toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .period-bar {
      align-items: center;
      justify-content: flex-start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      padding: 6px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .tabs button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .tabs button.active {
      border-color: #a8d4ca;
      background: var(--surface-2);
      color: var(--brand-dark);
    }

    .tabs svg {
      width: 15px;
      height: 15px;
    }

    .check-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .check-item {
      padding: 12px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .check-item.warn {
      border-left-color: var(--amber);
      background: #fffbeb;
    }

    .check-item strong,
    .check-item span {
      display: block;
    }

    .check-item span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .period-bar label,
    .field label,
    .inline-field {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 39px;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      outline: none;
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .btn,
    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 39px;
      padding: 8px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #ffffff;
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .icon-button {
      width: 38px;
      padding: 8px;
    }

    .btn:hover,
    .icon-button:hover {
      border-color: #8ea1ad;
      background: #f7faf9;
    }

    .btn.primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #ffffff;
    }

    .btn.primary:hover {
      background: var(--brand-dark);
    }

    .btn.blue {
      border-color: var(--blue);
      background: var(--blue);
      color: #ffffff;
    }

    .btn.danger {
      border-color: #f4c7c7;
      background: #fff5f5;
      color: var(--red);
    }

    .btn.ghost {
      background: transparent;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .metrics-grid {
      grid-template-columns: repeat(5, minmax(150px, 1fr));
    }

    .two-grid {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: start;
    }

    .three-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel,
    .metric-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .metric-card {
      min-height: 112px;
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .metric-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric-card strong {
      font-size: clamp(18px, 2vw, 26px);
      line-height: 1.15;
      word-break: break-word;
    }

    .metric-card small {
      color: var(--muted);
      font-size: 12px;
    }

    .tone-green {
      color: var(--green);
    }

    .tone-blue {
      color: var(--blue);
    }

    .tone-amber {
      color: var(--amber);
    }

    .tone-red {
      color: var(--red);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-header h3 {
      margin: 0;
      font-size: 15px;
    }

    .panel-header p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .panel-body {
      padding: 14px;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 320px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    .info-strip,
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .info-item,
    .summary-item {
      min-height: 70px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfc;
    }

    .info-item span,
    .summary-item span {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .info-item strong,
    .summary-item strong {
      font-size: 18px;
      word-break: break-word;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      font-size: 13px;
    }

    th,
    td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      background: #f7faf9;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    td.numeric,
    th.numeric {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .table-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .pill.green {
      background: #e8f7ee;
      color: var(--green);
    }

    .pill.red {
      background: #fff1f1;
      color: var(--red);
    }

    .pill.blue {
      background: #eef4ff;
      color: var(--blue);
    }

    .pill.amber {
      background: #fff7ed;
      color: var(--amber);
    }

    .empty-cell,
    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 28px 14px;
    }

    .calculator-result {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .calculator-result div {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfc;
    }

    .calculator-result span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .calculator-result strong {
      font-size: 15px;
      word-break: break-word;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(31, 41, 51, 0.45);
    }

    .modal {
      width: min(760px, 100%);
      max-height: calc(100vh - 36px);
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-header,
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
    }

    .modal-body {
      padding: 16px;
      overflow: auto;
    }

    .modal-footer {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 80;
      max-width: min(420px, calc(100vw - 40px));
      padding: 12px 14px;
      border-radius: var(--radius);
      background: #1f2933;
      color: #ffffff;
      box-shadow: var(--shadow);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: 0.18s ease;
      font-size: 13px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      background: rgba(245, 247, 248, 0.55);
    }

    .loader {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: var(--shadow);
      color: var(--muted);
      font-weight: 700;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid #d7e6e2;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .hidden {
      display: none !important;
    }

    .print-title {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 1180px) {
      .metrics-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .two-grid,
      .three-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 820px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .menu {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .sidebar-footer {
        display: none;
      }

      .topbar {
        position: static;
        padding: 14px 16px;
      }

      .content {
        padding: 16px;
      }

      .metrics-grid,
      .info-strip,
      .summary-strip,
      .check-strip,
      .calculator-result,
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      @page {
        margin: 14mm;
      }

      body {
        background: #ffffff;
      }

      .sidebar,
      .topbar,
      .no-print,
      .modal-backdrop,
      .toast,
      .loading {
        display: none !important;
      }

      .app-shell {
        display: block;
      }

      .content {
        max-width: none;
        padding: 0;
      }

      .panel {
        border: 0;
        break-inside: avoid;
      }

      .panel-header {
        padding-left: 0;
        padding-right: 0;
      }

      .panel-body {
        padding-left: 0;
        padding-right: 0;
      }

      .print-title {
        display: block;
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" id="brandMark">KSP</div>
        <div>
          <h1 id="brandName">Koperasi Simpan Pinjam</h1>
          <p id="brandAddress">Google Sheet Database</p>
        </div>
      </div>
      <nav class="menu" id="menu"></nav>
      <div class="sidebar-footer">
        <strong id="sidebarSummary">Database siap.</strong>
        <div id="sidebarDetails">Transaksi tersimpan otomatis ke Google Sheet.</div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <p id="pageMeta">Memuat data</p>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div id="topActions" class="no-print"></div>
      </header>
      <main class="content" id="content"></main>
    </section>
  </div>

  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>
  <div class="loading hidden" id="loading">
    <div class="loader"><span class="spinner"></span><span>Memproses</span></div>
  </div>

  <script>

    var state = {

        { tanggal: '2026-02-01', noBukti: 'PPD-001', sumber: 'Pembiayaan', refId: 'PNJ-001', kodeAkun: '1112', namaAkun: 'Bank Operasional', debet: 0, kredit: 5000000, memo: 'Pencairan pembiayaan' },
        { tanggal: '2026-02-01', noBukti: 'PPD-001', sumber: 'Pembiayaan', refId: 'PNJ-001', kodeAkun: '1129', namaAkun: 'Margin Murabahah Tangguhan', debet: 0, kredit: 1000000, memo: 'Margin tangguhan' },

    async function loadData() {
      setBusy(true);
      try {
        state.data = await api('getAppData', state.period);
        render();
      } catch (error) {
        showToast(errorMessage(error));
      } finally {
        setBusy(false);
      }
    }

    function api(fn) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject);
        runner[fn].apply(runner, args);
      });
    }

    function render() {
      if (!state.data) return;
      renderBrand();
      renderMenu();

      var current = MENU.find(function (item) { return item.id === state.active; }) || MENU[0];
      document.getElementById('pageTitle').textContent = current.label;
      document.getElementById('pageMeta').textContent = state.data.settings.namaKoperasi || 'Koperasi Simpan Pinjam';
      document.getElementById('topActions').innerHTML = '<button class="icon-button" onclick="loadData()" title="Muat ulang"><i data-lucide="refresh-cw"></i></button>';

      if (state.active === 'dashboard') renderDashboard();
      if (state.active === 'anggota') renderMembers();
      if (state.active === 'simpanan') renderSavings();
      if (state.active === 'pinjaman') renderLoans();
      if (state.active === 'laporan') renderReports();
      if (state.active === 'pengaturan') renderSettings();

      activateIcons();
    }

    function renderBrand() {
      var settings = state.data.settings || {};
      document.getElementById('brandName').textContent = settings.namaKoperasi || 'Koperasi Simpan Pinjam';
      document.getElementById('brandAddress').textContent = settings.alamatKoperasi || 'Google Sheet Database';
      document.getElementById('brandMark').innerHTML = settings.logoUrl
        ? '<img src="' + escapeHtml(settings.logoUrl) + '" alt="Logo">'

      document.getElementById('sidebarSummary').textContent = 'Kas ' + rupiah(metrics.totalKas);

    async function submitMember(event) {
      event.preventDefault();
      setBusy(true);
      try {
        await api('saveMember', formPayload(event.target));
        closeModal();
        await loadData();
        showToast('Data anggota tersimpan.');
      } catch (error) {
        showToast(errorMessage(error));
      } finally {
        setBusy(false);
      }
    }

    async function processExit(id) {
      var member = findMember(id);
      if (!member) return;
      var net = member.totalSimpanan - member.sisaPinjaman;
      var label = net >= 0 ? 'dibayarkan ke anggota' : 'ditagihkan ke anggota';
      var ok = confirm(
        'Proses keluar ' + member.nama + '?\n\n'
        + 'Total simpanan: ' + rupiah(member.totalSimpanan) + '\n'
        + 'Sisa pinjaman: ' + rupiah(member.sisaPinjaman) + '\n'
        + 'Saldo akhir: ' + rupiah(Math.abs(net)) + ' ' + label + '.'
      );
      if (!ok) return;

      setBusy(true);
      try {
        var result = await api('processMemberExit', {
          idAnggota: id,
          tanggal: todayInput(),
          catatan: 'Proses keluar anggota'
        });
        await loadData();
        showToast(result.message || 'Anggota dinonaktifkan.');
      } catch (error) {
        showToast(errorMessage(error));
      } finally {
        setBusy(false);
      }
    }

      var payload = formPayload(event.target);
      payload.nominal = Number(payload.nominal || 0);
      setBusy(true);
      try {
        var result = await api('saveSavingTransaction', payload);
        event.target.reset();
        await loadData();
        showToast('Transaksi simpanan tersimpan.');
        if (confirm('Download kuitansi transaksi?')) {
          await downloadReceipt('simpanan', result.transaction.idTransaksi);
        }
      } catch (error) {
        showToast(errorMessage(error));
      } finally {
        setBusy(false);
      }
    }

        + field('Akad Syariah', '<select name="akad" required><option>Murabahah</option><option>Qardh</option><option>Ijarah Multijasa</option></select>')
        + field('Program', '<input name="program" placeholder="Contoh: MIKA General Financing">')
        + field('Tujuan Pembiayaan', '<input name="tujuan" placeholder="Pembelian barang, pendidikan, usaha..." required>', 'full')
        + field('Pokok Pembiayaan', '<input id="loanPrincipal" type="number" name="pokok" min="1" step="1" required oninput="updateLoanCalc()">')
        + field('Tenor Bulan', '<input id="loanTenor" type="number" name="tenor" min="1" step="1" value="12" required oninput="updateLoanCalc()">')
        + field('Margin/Ujrah per Bulan (%)', '<input id="loanRate" type="number" name="bungaPersen" min="0" step="0.01" value="' + escapeHtml(settings.bungaPinjaman || 0) + '" required oninput="updateLoanCalc()">')
        + field('Biaya Admin', '<input id="loanAdmin" type="number" name="biayaAdmin" min="0" step="1" value="' + escapeHtml(settings.biayaAdmin || 0) + '" oninput="updateLoanCalc()">')
        + field('Keterangan', '<textarea name="keterangan"></textarea>', 'full')
        + '<div class="calculator-result full">'
        + '<div><span>Total Margin/Ujrah</span><strong id="calcInterest">Rp 0</strong></div>'
        + '<div><span>Total Tagihan</span><strong id="calcTotal">Rp 0</strong></div>'
        + '<div><span>Angsuran</span><strong id="calcInstallment">Rp 0</strong></div>'
        + '<div><span>Admin</span><strong id="calcAdmin">Rp 0</strong></div>'
        + '</div>'
        + '<div class="form-actions full"><button class="btn primary" type="submit"><i data-lucide="save"></i>Ajukan Pinjaman</button></div>'
        + '</form>';
    }

    function updateLoanCalc() {
      var pokok = numberFromInput('loanPrincipal');
      var tenor = Math.max(1, numberFromInput('loanTenor'));
      var rate = numberFromInput('loanRate');
      var admin = numberFromInput('loanAdmin');
      var totalBunga = Math.round(pokok * (rate / 100) * tenor);
      var total = pokok + totalBunga;
      var angsuran = tenor ? Math.round(total / tenor) : 0;
      setText('calcInterest', rupiah(totalBunga));
      setText('calcTotal', rupiah(total));
      setText('calcInstallment', rupiah(angsuran));
      setText('calcAdmin', rupiah(admin));
    }

    async function submitLoan(event) {
      event.preventDefault();
      var payload = formPayload(event.target);
      payload.pokok = Number(payload.pokok || 0);
      payload.tenor = Number(payload.tenor || 0);
      payload.bungaPersen = Number(payload.bungaPersen || 0);
      payload.biayaAdmin = Number(payload.biayaAdmin || 0);
      setBusy(true);
      try {
        var result = await api('createLoan', payload);
        event.target.reset();
        await loadData();
        showToast('Pinjaman berhasil dibuat.');
        if (confirm('Download bukti pencairan pinjaman?')) {
          await downloadReceipt('pinjaman', result.loan.idPinjaman);
        }
      } catch (error) {
        showToast(errorMessage(error));
      } finally {
        setBusy(false);
      }
    }

    function loanSummary() {
      var active = state.data.loans.filter(function (loan) { return loan.status !== 'Lunas'; });
      var principal = active.reduce(function (sum, loan) { return sum + loan.pokok; }, 0);
      var outstanding = active.reduce(function (sum, loan) { return sum + loan.sisaPinjaman; }, 0);
      var paid = state.data.loans.reduce(function (sum, loan) { return sum + loan.totalDibayar; }, 0);
      return '<div class="info-strip">'
        + infoItem('Aktif', number(active.length))
        + infoItem('Pokok Aktif', rupiah(principal))
        + infoItem('Sisa Tagihan', rupiah(outstanding))
        + infoItem('Terbayar', rupiah(paid))
        + '</div>';
    }

    function loansTable() {
      var rows = state.data.loans || [];
      if (!rows.length) return '<div class="empty-state">Belum ada pinjaman.</div>';
      return '<div class="table-wrap"><table><thead><tr>'
        + '<th>Tanggal</th><th>ID Pinjaman</th><th>Anggota</th><th>Akad / Tujuan</th><th class="numeric">Pokok</th><th class="numeric">Tagihan</th><th class="numeric">Angsuran</th><th class="numeric">Sisa</th><th>Status</th><th class="numeric no-print">Aksi</th>'
        + '</tr></thead><tbody>' + rows.map(function (loan) {
          return '<tr>'
            + '<td>' + formatDate(loan.tanggal) + '</td>'
            + '<td><strong>' + escapeHtml(loan.idPinjaman) + '</strong></td>'
            + '<td>' + escapeHtml(loan.nama) + '<br><small>' + escapeHtml(loan.idAnggota) + '</small></td>'
            + '<td><strong>' + escapeHtml(loan.akad || 'Murabahah') + '</strong><br><small>' + escapeHtml(loan.tujuan || '-') + '</small></td>'
            + '<td class="numeric">' + rupiah(loan.pokok) + '</td>'
            + '<td class="numeric">' + rupiah(loan.totalTagihan) + '</td>'
            + '<td class="numeric">' + rupiah(loan.angsuranBulanan) + '</td>'

            + '<td class="numeric no-print"><div class="table-actions">'
            + '<button class="icon-button" onclick="openPaymentForm(\'' + loan.idPinjaman + '\')" title="Bayar angsuran" ' + (loan.status === 'Lunas' ? 'disabled' : '') + '><i data-lucide="circle-dollar-sign"></i></button>'
            + '<button class="icon-button" onclick="downloadReceipt(\'pinjaman\', \'' + loan.idPinjaman + '\')" title="Download bukti"><i data-lucide="download"></i></button>'
            + '</div></td></tr>';
        }).join('') + '</tbody></table></div>';

    function installmentsTable() {
      var rows = state.data.installments || [];
      if (!rows.length) return '<div class="empty-state">Belum ada pembayaran angsuran.</div>';
      return '<div class="table-wrap"><table><thead><tr>'
        + '<th>Tanggal</th><th>ID Angsuran</th><th>ID Pinjaman</th><th>Anggota</th><th class="numeric">Ke</th><th class="numeric">Nominal</th><th class="numeric">Denda</th><th class="numeric">Total</th><th class="numeric">Sisa</th><th class="numeric no-print">PDF</th>'
        + '</tr></thead><tbody>' + rows.map(function (row) {
          return '<tr>'
            + '<td>' + formatDate(row.tanggal) + '</td>'
            + '<td><strong>' + escapeHtml(row.idAngsuran) + '</strong></td>'
            + '<td>' + escapeHtml(row.idPinjaman) + '</td>'
            + '<td>' + escapeHtml(row.nama) + '<br><small>' + escapeHtml(row.idAnggota) + '</small></td>'
            + '<td class="numeric">' + number(row.angsuranKe) + '</td>'
            + '<td class="numeric">' + rupiah(row.nominal) + '</td>'
            + '<td class="numeric">' + rupiah(row.denda) + '</td>'
            + '<td class="numeric">' + rupiah(row.totalBayar) + '</td>'

            + '</tr>';
        }).join('') + '</tbody></table></div>';

    function openPaymentForm(idPinjaman) {
      var loan = findLoan(idPinjaman);
      if (!loan) return;
      var defaultPay = Math.min(loan.angsuranBulanan, loan.sisaPinjaman);
      var body = '<div class="info-strip">'
        + infoItem('Anggota', escapeHtml(loan.nama))
        + infoItem('Angsuran', rupiah(loan.angsuranBulanan))
        + infoItem('Sisa', rupiah(loan.sisaPinjaman))
        + infoItem('Status', escapeHtml(loan.status))
        + '</div>'
        + '<form id="paymentForm" class="form-grid" onsubmit="submitPayment(event)">'
        + '<input type="hidden" name="idPinjaman" value="' + escapeHtml(loan.idPinjaman) + '">'
        + field('Tanggal', '<input type="date" name="tanggal" value="' + todayInput() + '" required>')
        + field('Nominal Angsuran', '<input type="number" name="nominal" min="1" step="1" value="' + defaultPay + '" required>')
        + field('Denda', '<input type="number" name="denda" min="0" step="1" value="0">')
        + field('Keterangan', '<input name="keterangan" placeholder="Opsional">')
        + '</form>';
      openModal('Pembayaran Angsuran', body, '<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" form="paymentForm" type="submit"><i data-lucide="save"></i>Proses Bayar</button>');
    }

    async function submitPayment(event) {
      event.preventDefault();
      var payload = formPayload(event.target);
      payload.nominal = Number(payload.nominal || 0);
      payload.denda = Number(payload.denda || 0);
      setBusy(true);
      try {
        var result = await api('payInstallment', payload);
        closeModal();
        await loadData();
        showToast(result.loanStatus === 'Lunas' ? 'Pinjaman sudah lunas.' : 'Angsuran tersimpan.');
        if (confirm('Download kuitansi angsuran?')) {
          await downloadReceipt('angsuran', result.installment.idAngsuran);
        }
      } catch (error) {
        showToast(errorMessage(error));
      } finally {
        setBusy(false);
      }
    }

    function renderReports() {
      var report = state.data.accounting;
      document.getElementById('content').innerHTML =
        '<div class="print-title"><h2>Akuntansi dan Laporan Keuangan</h2><p>' + escapeHtml(report.period.label) + '</p></div>'
        + periodControls()
        + '<div class="toolbar no-print"><span></span><div class="table-actions">'
        + '<button class="btn" onclick="syncJournals()"><i data-lucide="refresh-cw"></i>Sinkron Jurnal</button>'
        + '<button class="btn blue" onclick="downloadFinancialExcel()"><i data-lucide="file-spreadsheet"></i>Download Excel</button>'
        + '<button class="btn primary" onclick="window.print()"><i data-lucide="printer"></i>Cetak</button>'
        + '</div></div>'
        + accountingTabs()
        + '<div id="accountingContent">' + accountingTabContent(report) + '</div>';
    }

    function accountingTabs() {
      var tabs = [
        ['ringkasan', 'Ringkasan', 'gauge'],
        ['transaksi', 'Transaksi Bank', 'landmark'],
        ['coa', 'COA', 'list-tree'],
        ['kas', 'Rincian Kas', 'banknote'],
        ['jurnal', 'Jurnal', 'book-open'],
        ['tb', 'Trial Balance', 'scale'],
        ['neraca', 'Neraca', 'columns-3'],
        ['laba', 'Laba Rugi', 'chart-no-axes-combined'],
        ['pinjaman', 'Rincian Pinjaman', 'hand-coins'],
        ['shu', 'Pembagian SHU', 'pie-chart'],
        ['aset', 'Aset Tetap', 'monitor-cog'],
        ['kebajikan', 'Dana Kebajikan', 'heart-handshake'],
        ['administrasi', 'Administrasi', 'folder-check']
      ];
      return '<nav class="tabs no-print">' + tabs.map(function (tab) {
        return '<button class="' + (state.accountingTab === tab[0] ? 'active' : '') + '" onclick="setAccountingTab(\'' + tab[0] + '\')">'
          + '<i data-lucide="' + tab[2] + '"></i>' + tab[1] + '</button>';
      }).join('') + '</nav>';

    function setAccountingTab(tab) {
      state.accountingTab = tab;
      renderReports();
      activateIcons();
    }

    function accountingTabContent(report) {
      if (state.accountingTab === 'transaksi') return financialTransactionView(report);
      if (state.accountingTab === 'coa') return coaView(report);
      if (state.accountingTab === 'kas') return panel('Rincian Kas dan Bank', report.period.label, mutationTable(report.cash.rows));
      if (state.accountingTab === 'jurnal') return panel('Jurnal Umum', report.period.label, journalTable(report.journal));
      if (state.accountingTab === 'tb') return panel('Trial Balance', report.period.label, trialBalanceTable(report.trialBalance));
      if (state.accountingTab === 'neraca') return statementView('Laporan Posisi Keuangan', report.period.label, report.neraca);
      if (state.accountingTab === 'laba') return profitLossView(report.labaRugi, report.period.label);
      if (state.accountingTab === 'pinjaman') return panel('Rincian Pembiayaan', 'Akad, margin, tagihan, dan saldo berjalan', loansTable());
      if (state.accountingTab === 'shu') return shuView(report);
      if (state.accountingTab === 'aset') return fixedAssetView(report);
      if (state.accountingTab === 'kebajikan') return benevolentView(report);
      if (state.accountingTab === 'administrasi') return administrationView(report);
      return accountingOverview(report);
    }

    function accountingOverview(report) {
      var journalOk = Math.abs(report.checks.journalDifference) < 1;
      var balanceOk = Math.abs(report.checks.balanceDifference) < 1;
      return '<section class="check-strip">'
        + checkItem('Jurnal Debit = Kredit', journalOk ? 'Balance' : rupiah(report.checks.journalDifference), journalOk)
        + checkItem('Neraca Seimbang', balanceOk ? 'Balance' : rupiah(report.checks.balanceDifference), balanceOk)
        + checkItem('Akun Belum Diklasifikasi', number(report.checks.unclassifiedCount), report.checks.unclassifiedCount === 0)
        + '</section>'
        + '<section class="grid metrics-grid">'
        + metricCard('Kas Akhir', rupiah(report.cash.saldoAkhir), 'banknote', 'tone-green', 'Kas masuk ' + rupiah(report.cash.totalMasuk))
        + metricCard('Total Aset', rupiah(report.neraca.totalAset), 'landmark', 'tone-blue', report.period.label)
        + metricCard('Kewajiban', rupiah(report.neraca.totalKewajiban), 'receipt-text', 'tone-amber', 'Dana anggota dan kewajiban lain')
        + metricCard('Ekuitas', rupiah(report.neraca.totalEkuitas), 'wallet', 'tone-green', 'Termasuk SHU berjalan')
        + metricCard('SHU Bersih', rupiah(report.labaRugi.shuBersih), 'badge-dollar-sign', report.labaRugi.shuBersih >= 0 ? 'tone-green' : 'tone-red', 'Pendapatan dikurangi beban')
        + '</section>'
        + '<section class="grid two-grid" style="margin-top:14px;">'
        + panel('Laba Rugi Ringkas', report.period.label, compactStatement(report.labaRugi.pendapatan, 'Total Pendapatan', report.labaRugi.totalPendapatan)
          + compactStatement(report.labaRugi.beban, 'Total Beban', report.labaRugi.totalBeban)
          + '<div class="summary-strip" style="margin:12px 0 0;">' + infoItem('SHU Bersih', rupiah(report.labaRugi.shuBersih)) + '</div>')
        + panel('Status Administrasi', 'Dokumen dan register pendukung', '<div class="info-strip">'
          + infoItem('COA Aktif', number(report.accounts.length))

          + infoItem('Dokumen', number(report.administration.length))
          + '</div>')
        + '</section>';
    }

    function checkItem(label, value, ok) {
      return '<div class="check-item ' + (ok ? '' : 'warn') + '"><strong>' + escapeHtml(label) + '</strong><span>' + escapeHtml(value) + '</span></div>';
    }

          + field('No. Bukti', '<input name="noBukti" placeholder="BKK/BKM/BR-001">')
          + field('Rekening Kas/Bank', '<select name="kodeRekening" required>' + cashOptions + '</select>')
          + field('Akun Lawan', '<select name="kodeLawanAkun" required>' + accountOptions() + '</select>')
          + field('Nominal', '<input type="number" name="nominal" min="1" step="1" required>')

          + field('Nomor Rekening', '<input name="nomorRekening">')
          + field('Kode Akun', '<select name="kodeAkun" required>' + cashOptions + '</select>')

    function downloadBase64File(file) {
      var blob = base64ToBlob(file.base64, file.mimeType);
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = file.filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function base64ToBlob(base64, mimeType) {
      var binary = atob(base64);
      var length = binary.length;
      var bytes = new Uint8Array(length);
      for (var i = 0; i < length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: mimeType });
    }

    }

    function emptyRow(cols, text) {
      return '<tr><td colspan="' + cols + '" class="empty-cell">' + escapeHtml(text) + '</td></tr>';
    }

    function setBusy(isBusy) {
      state.busy = isBusy;
      document.getElementById('loading').classList.toggle('hidden', !isBusy);
    }

    function showToast(message) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function () {
        toast.classList.remove('show');
      }, 3600);
    }

    function activateIcons() {
      if (window.lucide) lucide.createIcons();
    }

    function rupiah(value) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(Number(value || 0));
    }

    function shortRupiah(value) {
      var number = Number(value || 0);
      if (Math.abs(number) >= 1000000000) return 'Rp ' + Math.round(number / 1000000000) + 'M';
      if (Math.abs(number) >= 1000000) return 'Rp ' + Math.round(number / 1000000) + 'jt';
      if (Math.abs(number) >= 1000) return 'Rp ' + Math.round(number / 1000) + 'rb';
      return 'Rp ' + number;
    }

    function number(value) {
      return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(Number(value || 0));
    }

    function formatDate(value) {
      if (!value) return '-';
      var parts = String(value).split('-');
      if (parts.length === 3) {
        return parts[2] + '/' + parts[1] + '/' + parts[0];
      }
      return value;
    }

    function todayInput() {
      var now = new Date();
      var local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function valueOf(id) {
      var el = document.getElementById(id);
      return el ? el.value : '';
    }

    function setText(id, value) {
      var el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function numberFromInput(id) {
      return Number(valueOf(id) || 0);
    }

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function errorMessage(error) {
      if (!error) return 'Terjadi kesalahan.';
      if (error.message) return error.message;
      return String(error);
    }
  </script>
</body>
</html>
